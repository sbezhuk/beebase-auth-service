openapi: 3.0.3
info:
  title: BeeBase Auth Service API
  description: >
    Authentication service for BeeBase, an open-source backend for a
    beekeeper management application split into microservices. Holds the
    only private key in the deployment; every other BeeBase service
    verifies the tokens issued here via /.well-known/jwks.json instead of
    calling this service directly.
  version: 0.3.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: auth
    description: Registration, login, session refresh, logout, and the current user.
  - name: keys
    description: Public key distribution for other services to verify access tokens.

paths:
  /.well-known/jwks.json:
    get:
      tags: [keys]
      summary: This service's public key, as a JSON Web Key Set
      description: >
        Fetched and cached by every other BeeBase service to verify access
        tokens issued here. Contains only the public key — never the
        private key used to sign tokens.
      responses:
        "200":
          description: A JSON Web Key Set (RFC 7517) containing one EdDSA public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object

  /health:
    get:
      tags: [system]
      summary: Liveness probe
      description: Always returns 200 while the process is running. Has no dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      description: Returns 200 only if the database is reachable.
      responses:
        "200":
          description: The service is ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: >
        Creates a user and returns an established session, so a client can
        register and immediately act as that user without a separate login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; session established.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: Request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session established.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: Request failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: >
            Invalid email or password. Deliberately not distinguished, so a
            login attempt can't be used to enumerate registered emails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new access/refresh pair
      description: >
        The refresh token travels as an HttpOnly cookie (see
        refreshTokenCookie), never in the request body. The presented token
        is revoked and a new pair is issued (rotation). Presenting a token
        that was already revoked is treated as evidence of theft: every
        refresh token belonging to that user is revoked, ending the whole
        session family.
      security:
        - refreshTokenCookie: []
      responses:
        "200":
          description: New session issued.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401":
          description: >
            The refresh_token cookie is missing, or the token it carries is
            unknown, expired, or already revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      description: >
        The refresh token travels as an HttpOnly cookie (see
        refreshTokenCookie), never in the request body. Idempotent:
        revoking an already-revoked or unknown token still returns 204,
        since the desired end state already holds.
      security:
        - refreshTokenCookie: []
      responses:
        "204":
          description: The token is revoked (or already was); the cookie is cleared.
          headers:
            Set-Cookie:
              description: >-
                Clears the refresh_token cookie (Max-Age=0).
              schema: { type: string }
        "401":
          description: The refresh_token cookie is missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401":
          description: >
            No Authorization header (code missing_authorization), or an
            invalid/expired access token (code invalid_access_token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >-
        Opaque, single-use refresh token. Set as an HttpOnly cookie by
        /register, /login, and /refresh, scoped to /api/v1/auth — never
        readable from client-side JavaScript and never present in a JSON
        response body.

  headers:
    RefreshTokenCookie:
      description: >-
        Sets the refresh_token cookie (HttpOnly; scoped to /api/v1/auth).
      schema: { type: string }

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }

    SessionResponse:
      type: object
      description: >-
        The refresh token itself is never included here — it's set as an
        HttpOnly refresh_token cookie instead (see the refreshTokenCookie
        security scheme), so it's never exposed to client-side JavaScript.
        Its expiry is returned as refresh_token_expires_at, since that's
        plain metadata a client can use to know when it'll need to
        re-authenticate — unlike the cookie's own Expires attribute, which
        JavaScript can never read.
      properties:
        access_token:
          type: string
          description: >-
            Short-lived JWT. Send as "Authorization: Bearer <token>".
        access_token_expires_at:
          type: integer
          format: int64
          description: >-
            Unix timestamp (seconds) access_token expires at (issued at
            now + ACCESS_TOKEN_TTL, 15m by default) — matches the "exp"
            claim already inside the JWT, and is always well before
            refresh_token_expires_at.
          example: 1768470300
        refresh_token_expires_at:
          type: integer
          format: int64
          description: >-
            Unix timestamp (seconds) the refresh_token cookie expires at
            (issued at now + REFRESH_TOKEN_TTL, 720h/30d by default).
          example: 1771061400
        user: { $ref: "#/components/schemas/UserResponse" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of a fixed set of error codes returned by this API.
              enum:
                - email_taken
                - user_not_found
                - invalid_credentials
                - invalid_refresh_token
                - missing_authorization
                - invalid_access_token
                - invalid_body
                - internal_error
              example: invalid_credentials
            message: { type: string, example: invalid email or password }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: >
                Field name to error code. Each value is a stable key (not a
                human-readable message) meant to be localized client-side.
              additionalProperties:
                type: string
                enum:
                  - email_required
                  - email_invalid
                  - password_required
                  - password_too_short
              example: { email: "email_invalid" }
